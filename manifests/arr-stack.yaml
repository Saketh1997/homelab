---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: readarr
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: readarr
  template:
    metadata:
      labels:
        app: readarr
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kubernetes.io/hostname: huntersmachinegun
      containers:
        - name: readarr
          image: lscr.io/linuxserver/readarr:0.4.19-nightly
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/Los_Angeles"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: audiobooks
              mountPath: /data/audiobooks
            - name: books
              mountPath: /data/books
      volumes:
        - name: config
          hostPath:
            path: /home/hunter/docker/appdata/readarr
            type: DirectoryOrCreate
        - name: audiobooks
          hostPath:
            path: /mnt/ServerSpace/AudioBooks
            type: DirectoryOrCreate
        - name: books
          hostPath:
            path: /mnt/ServerSpace/Books
            type: DirectoryOrCreate